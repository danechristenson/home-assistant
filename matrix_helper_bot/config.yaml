name: Matrix Helper Bot
version: "1.1.0"
slug: matrix_helper_bot
description: Lets chosen people reset Matrix passwords and manage Minecraft players from chat
url: https://github.com/danechristenson/home-assistant/tree/main/matrix_helper_bot
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
options:
  username: helper
  password: ""
  helpers: []
  password_message_minutes: 10
  minecraft_key: ""
  minecraft_url: ""
  matrix_url: ""
schema:
  username: str
  password: password
  helpers:
    - user: str
      reset_passwords: bool?
      minecraft: bool?
  password_message_minutes: int(1,60)
  minecraft_key: password?
  minecraft_url: str?
  matrix_url: str?
