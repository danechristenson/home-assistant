name: Matrix
version: "26.9.1.6"
slug: matrix
description: Private, encrypted group chat on Home Assistant, using the Element app
url: https://github.com/danechristenson/home-assistant/tree/main/matrix
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:matrix
# Every Home Assistant user gets Element in the sidebar, not only admins
panel_admin: false
panel_title: Element
ports:
  8008/tcp: 8008
  8010/tcp: 8010
ports_description:
  8008/tcp: Matrix client API (point Matrix apps here)
  8010/tcp: Public landing page (point the reverse proxy's "/" here)
map:
  - ssl
  - share
options:
  server_name: ""
  homeserver_url: ""
  registration_token: ""
  allow_federation: false
  ingress_autologin: true
  call_relay: false
  group_calls: false
  lockdown_room_directory: true
  allow_room_creation: true
  auto_join_rooms: []
  federation_allowed_servers: []
  landing_contact: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  server_name: str
  homeserver_url: str
  registration_token: password
  allow_federation: bool
  ingress_autologin: bool?
  call_relay: bool?
  group_calls: bool?
  lockdown_room_directory: bool?
  allow_room_creation: bool?
  auto_join_rooms:
    - str?
  federation_allowed_servers:
    - str?
  landing_contact: str?
  ssl: bool
  certfile: str
  keyfile: str
