name: Matrix Group Calls
version: "1.13.9.4"
slug: matrix_group_calls
description: Group voice and video calls with screen sharing for the Matrix add-on
url: https://github.com/danechristenson/home-assistant/tree/main/matrix_group_calls
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
# Host networking: LiveKit must see the home-network address to offer it to
# devices at home, and media then skips Docker's port forwarding
host_network: true
map:
  - share:rw
ports:
  7880/tcp: 7880
  7883/tcp: 7883
  7881/tcp: 7881
  7882/udp: 7882
ports_description:
  7880/tcp: LiveKit signalling (point the reverse proxy here; don't forward)
  7883/tcp: Call sign-in service (point the reverse proxy here; don't forward)
  7881/tcp: Call media over TCP (forward on the router)
  7882/udp: Call media over UDP (forward on the router)
options:
  domain: ""
  matrix_server_name: ""
  max_people_per_call: 8
  max_total_mbps: 100
schema:
  domain: str
  matrix_server_name: str
  max_people_per_call: int(0,)?
  max_total_mbps: int(0,)?
