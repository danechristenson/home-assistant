name: VoceChat
version: "0.5.36"
slug: vocechat
description: Self-hosted, lightweight chat server with a web UI
url: https://github.com/danchristenson/home-assistant/tree/main/vocechat
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
webui: "[PROTO:ssl]://[HOST]:[PORT:3000]/"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: VoceChat web UI and API
map:
  - ssl
backup_exclude:
  - "*.log"
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  domain: str?
  frontend_url: url?
  ssl: bool
  certfile: str
  keyfile: str
