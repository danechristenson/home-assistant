configuration:
  address:
    name: Public address
    description: >-
      Hostname (or IP) that phones use to reach this relay from the internet,
      e.g. matrix.example.com. It must point to your home's public IP in
      public DNS. Usually the same host as the Matrix add-on's Server
      address.
