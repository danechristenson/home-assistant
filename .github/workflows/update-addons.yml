name: Update add-ons

# Daily: bump the add-ons to the latest upstream releases within their
# current major version, build and smoke-test them, and commit to main only if
# they pass. Home Assistant then offers the update (or installs it, with Auto
# update on). New major versions go to a pull request per add-on instead
# (needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests").

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: update-addons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check for new upstream releases
        id: check
        run: |
          changed=$(python3 .github/scripts/update_addons.py)
          echo "changed=$(echo $changed)" >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test changed add-ons
        if: steps.check.outputs.changed != ''
        run: |
          for addon in ${{ steps.check.outputs.changed }}; do
            sh .github/scripts/smoke_test.sh "$addon"
          done

      - name: Commit
        if: steps.check.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farmos foundry_vtt matrix matrix_call_relay matrix_group_calls matrix_helper_bot minecraft_bedrock
          git commit -m "chore: update ${{ steps.check.outputs.changed }} to latest upstream releases"
          git push

  major:
    # After the daily update, so the pull requests start from the newest main
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Open pull requests for new major versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/major_updates.sh
